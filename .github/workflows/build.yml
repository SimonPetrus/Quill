name: Build (unsigned IPA)

# Fork CI: builds an unsigned (ad-hoc, no team) Quill.ipa on every push / PR,
# uploads it as a workflow artifact and (for pushes / manual runs) force-pushes
# it as a single commit so it can be fetched even when the account's artifact
# storage quota is full: `ipa-builds` for the quill branch (user IPA), `ipa-builds-dev`
# for every other branch (intermediate builds). Never creates releases or tags.

on:
  push:
    branches:
      - '**'
      - '!ipa-builds'
      - '!ipa-builds-dev'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      xcode:
        description: 'Xcode version (e.g. 26.3.0, 26.6.0)'
        required: false
        default: '26.3.0'

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed only to push the IPA to the ipa-builds branch

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'

      - name: Select Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          # Default to the version upstream's release workflow uses, fall back to the newest Xcode 26.
          WANT="${{ github.event.inputs.xcode || '26.3.0' }}"
          if [ -d "/Applications/Xcode_${WANT}.app" ]; then
            XCODE="/Applications/Xcode_${WANT}.app"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Quill/iphoneos/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # xcodebuild sometimes aborts with an internal NSMutableArray exception while
      # registering package references right after a cold resolve. Resolve
      # separately (with retries) so the build step starts from a warm cache.
      - name: Resolve Swift packages
        run: |
          for i in 1 2 3; do
            echo "Resolve attempt $i"
            if xcodebuild -resolvePackageDependencies \
                 -project Feather.xcodeproj -scheme Feather \
                 -derivedDataPath "$RUNNER_TEMP/Quill/iphoneos" \
                 -skipPackagePluginValidation; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Build
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          agvtool new-version -all $(git rev-parse --short HEAD)
          make iphoneos

      - name: Show result
        run: |
          ls -la packages
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" _build/Payload/*.app/Info.plist

      # Orphan branch with exactly one commit (force-pushed), so history never grows.
      - name: Publish IPA to ipa-builds (quill) or ipa-builds-dev (other branches)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/quill" ]; then
            TARGET=ipa-builds
          else
            TARGET=ipa-builds-dev
          fi
          OUT="$RUNNER_TEMP/$TARGET"
          rm -rf "$OUT" && mkdir -p "$OUT" && cd "$OUT"
          git init -q -b "$TARGET"
          cp "$GITHUB_WORKSPACE/packages/Quill.ipa" .
          {
            echo "branch: $GITHUB_REF_NAME"
            echo "commit: $GITHUB_SHA"
            echo "run:    $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "sha256: $(shasum -a 256 Quill.ipa | cut -d' ' -f1)"
          } > BUILD_INFO.txt
          cat BUILD_INFO.txt
          git add Quill.ipa BUILD_INFO.txt
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "IPA build from $GITHUB_REF_NAME @ ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$TARGET"

      - name: Upload IPA
        # Artifact quota may be full; the ipa-builds branch above is the fallback.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Quill-${{ github.sha }}
          path: packages/Quill.ipa
          if-no-files-found: error
          retention-days: 14
