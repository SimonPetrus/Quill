name: Release

# Manual release of Quill. Run with dry_run=true (default) to build and preview the source JSON
# without creating a commit, tag, Release or `source` branch. Releases are only made on explicit
# approval:  gh workflow run release.yml -R SimonPetrus/Quill -f version=X -f dry_run=false
# Pushes made with GITHUB_TOKEN do not trigger other workflows (build.yml), on purpose.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.1'
        required: true
        type: string
      notes:
        description: 'Release notes (optional)'
        required: false
        type: string
      dry_run:
        description: 'Dry run: build and preview only, publish nothing'
        required: true
        type: boolean
        default: true
      source_only:
        description: 'Only regenerate and publish source.json from existing Releases (rescue a half-finished release)'
        required: false
        type: boolean
        default: false
      xcode:
        description: 'Xcode version'
        required: false
        default: '26.3.0'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ inputs.version }}
      NOTES: ${{ inputs.notes }}
      XCODE_WANT: ${{ inputs.xcode }}
      DRY_RUN: ${{ inputs.dry_run }}
      SOURCE_ONLY: ${{ inputs.source_only }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate version
        run: |
          RE='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'
          if ! [[ "$VERSION" =~ $RE ]]; then
            echo "Invalid version (expected e.g. 1.0.1)"; exit 1
          fi
          if [ "$SOURCE_ONLY" != "true" ]; then
            EXISTS=0
            gh release view "v${VERSION}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && EXISTS=1
            [ -n "$(git ls-remote --tags "https://github.com/${GITHUB_REPOSITORY}.git" "refs/tags/v${VERSION}")" ] && EXISTS=1
            if [ "$EXISTS" = "1" ]; then
              if [ "$DRY_RUN" = "true" ]; then
                echo "::warning::v${VERSION} already exists (a real release would fail)"
              else
                echo "v${VERSION} already exists; use source_only to republish the source"; exit 1
              fi
            fi
          fi

      - name: Checkout quill
        uses: actions/checkout@v4
        with:
          ref: quill
          submodules: 'true'

      # The release tooling comes from the ref the workflow was started on (may be a feature branch in a dry run).
      - name: Checkout release tooling
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: tools
          sparse-checkout: .github/scripts

      - name: Set version
        if: ${{ !inputs.source_only }}
        run: |
          sed -i '' "s/^QUILL_PROJECT_VERSION=.*/QUILL_PROJECT_VERSION=${VERSION}/" Quill.xcconfig
          grep QUILL_PROJECT_VERSION Quill.xcconfig

      - name: Select Xcode
        if: ${{ !inputs.source_only }}
        run: |
          WANT="${XCODE_WANT:-26.3.0}"
          case "$WANT" in *[!0-9.]*) echo "Invalid Xcode version"; exit 1 ;; esac
          if [ -d "/Applications/Xcode_${WANT}.app" ]; then
            XCODE="/Applications/Xcode_${WANT}.app"
          else
            XCODE=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)
          fi
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Cache Swift packages
        if: ${{ !inputs.source_only }}
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/Quill/iphoneos/SourcePackages
          key: spm-${{ runner.os }}-${{ hashFiles('Feather.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Resolve Swift packages
        if: ${{ !inputs.source_only }}
        run: |
          for i in 1 2 3; do
            echo "Resolve attempt $i"
            if xcodebuild -resolvePackageDependencies \
                 -project Feather.xcodeproj -scheme Feather \
                 -derivedDataPath "$RUNNER_TEMP/Quill/iphoneos" \
                 -skipPackagePluginValidation; then
              exit 0
            fi
            sleep 5
          done
          exit 1

      - name: Build
        if: ${{ !inputs.source_only }}
        env:
          TMPDIR: ${{ runner.temp }}/
        run: |
          agvtool new-version -all "$VERSION"
          make iphoneos

      - name: Show result
        if: ${{ !inputs.source_only }}
        run: |
          ls -la packages
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" _build/Payload/*.app/Info.plist
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" _build/Payload/*.app/Info.plist

      # Only the xcconfig change is committed (agvtool touches project files, which are reverted first).
      - name: Commit version bump to quill
        if: ${{ !inputs.dry_run && !inputs.source_only }}
        run: |
          git checkout -- Feather.xcodeproj Feather
          git add Quill.xcconfig
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Release v${VERSION}"
          git push origin HEAD:quill

      - name: Create tag and GitHub Release
        if: ${{ !inputs.dry_run && !inputs.source_only }}
        run: |
          PRE=""
          case "$VERSION" in *-*) PRE="--prerelease" ;; esac
          gh release create "v${VERSION}" packages/Quill.ipa $PRE \
            --target "$(git rev-parse HEAD)" \
            --title "Quill ${VERSION}" \
            --notes "${NOTES:-Quill ${VERSION}}"

      - name: Generate source.json
        run: |
          python3 tools/.github/scripts/make_source.py \
            --repo "$GITHUB_REPOSITORY" --out source.json \
            --icon-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/quill/.github/quill-icon.png"

      - name: Publish source branch
        if: ${{ !inputs.dry_run }}
        run: |
          OUT="$RUNNER_TEMP/source"
          rm -rf "$OUT" && mkdir -p "$OUT"
          cp source.json "$OUT/"
          cd "$OUT"
          git init -q -b source
          git add source.json
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Update source for v${VERSION}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" source

      - name: Upload source.json (dry run preview)
        if: ${{ inputs.dry_run }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: source-preview
          path: source.json
          retention-days: 7
